name:  Secure DevSecOps Pipeline
on:
    push:
        branches:
            - main
            - dev
    pull_request:
        branches:
            - main
permissions:
  contents: read


jobs:
    Build:
      
        runs-on: ubuntu-slim

        strategy:
          matrix:
            node-version: ['18.x', '20.x']

        steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Use Node.js
          uses: actions/setup-node@v7
          with:
             node-version: ${{ matrix.node-version }}
        
        - name: Use dependency caching
          uses: actions/cache@v4
          with:
            path:
                ~/.npm
            key: ${{ runner.os }}-build-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
            restore-keys: |
                           ${{ runner.os }}-build-${{ matrix.node-version }}
                           ${{ runner.os }}-build-
  
        - name: Install dependency
          working-directory: ./app
          run: npm ci
        
          ## API/Endpoint test or integration-style testing
        - name: Run tests
          working-directory: ./app
          run: npm test

        - name: Upload Artifact
          uses: actions/upload-artifact@v7
          with:
            name: artifact-${{ runner.os }}-node-${{ matrix.node-version }}
            path: ./app/package*
        

    SAST-and-SCA:

      runs-on: ubuntu-slim

      permissions: 
        contents: read
        actions: read
        security-events: write

      steps:

        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Use Node.js
          uses: actions/setup-node@v7
          with:
            node-version: 20.x
 
            ## Source code scanning for security issues and reliability
        - name: Intialize CodeQL
          uses: github/codeql-action/init@v4
          with:
            languages: javascript

        - name: Perform CodeQL Analysis
          uses: github/codeql-action/analyze@v4
        
          ## Dependency scanning for known security vulnerabilities
        - name: Audit dependencies
          working-directory: ./app
          run: npm audit --audit-level=high

    Docker:

       needs: [ Build, SAST-and-SCA ]

       runs-on: ubuntu-latest

       steps:

       - name: Checkout Code
         uses: actions/checkout@v4

       - name: Login to GHCR
         uses: docker/login-action@v3
         with:
           registry: ghcr.io
           username: ${{ github.actor }}
           password: ${{ secrets.GITHUB_TOKEN }}

       - name: Check base image
         run: |
              docker pull node:20-slim
              docker run --rm node:20-slim dpkg-query -W libgnutls30

       - name: Build Docker image
         uses: docker/build-push-action@v6
         with:
            context: .
            load: true
            tags: ghcr.io/${{ github.repository_owner }}/node-app:${{ github.sha }}

       - name: Locate brace-expansion
         run: |
               docker run --rm ghcr.io/${{ github.repository_owner }}/node-app:${{ github.sha }} \
               find /app/node_modules -path '*/brace-expansion/package.json' -print
               
       - name: Check production dependency tree
         run: |
               docker run --rm ghcr.io/${{ github.repository_owner }}/node-app:${{ github.sha }} \
               npm ls brace-expansion --omit=dev


         ## Image scan for known vulnerabilities
       - name: Run Trivy vulnerability scanner
         uses: aquasecurity/trivy-action@v0.36.0
         with:
            image-ref: 'ghcr.io/${{ github.repository_owner }}/node-app:${{ github.sha }}'
            format: 'table'
            exit-code: '1'
            ignore-unfixed: true
            vuln-type: 'os,library'
            severity: 'CRITICAL,HIGH'

       - name: Push image
         run: docker push ghcr.io/${{ github.repository_owner }}/node-app:${{ github.sha }}


        
        


